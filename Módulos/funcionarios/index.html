<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários</title>
    <link rel="stylesheet" href="/funcionarios/public/css/cadastrar.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="header">
                <h1>Cadastro de Funcionários</h1>
                <p>Preencha os dados abaixo para cadastrar um novo funcionário</p>
            </div>
    
            <div id="alert" class="alert"></div>
    
            <form id="form" data-method="post">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label for="nome">Nome completo <span>*</span></label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" minlength="3" maxlength="100" required>
                    </div>
    
                    <div class="form-group">
                        <label for="cpf">CPF <span>*</span></label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" minlength="14" maxlength="14" required>
                    </div>
    
                    <div class="form-group">
                        <label for="dt_nascimento">Data de Nascimento <span>*</span></label>
                        <input type="date" id="dt_nascimento" name="dt_nascimento" required>
                    </div>
    
                    <div class="form-group">
                        <label for="email">E-mail <span>*</span></label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" maxlength="100" required>
                    </div>
    
                    <div class="form-group">
                        <label for="fone">Telefone <span>*</span></label>
                        <input type="tel" id="fone" name="fone" placeholder="(00) 00000-0000" minlength="15" maxlength="15" required>
                    </div>
    
                    <div class="form-group">
                        <label for="departamento">Departamento <span>*</span></label>
                        <select id="departamento" name="departamento" required>
                            <option value="">Selecione um departamento</option>
                            <option value="atendimento">Atendimento</option>
                            <option value="estoque">Estoque</option>
                            <option value="financeiro">Financeiro</option>
                            <option value="servico">Serviço</option>
                            <option value="administrativo">Administrativo</option>
                        </select>
                    </div>
    
                    <div class="form-group">
                        <label for="cargo">Cargo <span>*</span></label>
                        <input type="text" id="cargo" name="cargo" placeholder="Digite o cargo" maxlength="100" required>
                    </div>
    
                    <div class="form-group">
                        <label for="salario">Salário <span>*</span></label>
                        <input type="number" id="salario" name="salario" step="0.01" min="0" placeholder="0,00" required>
                        <div class="info-text">Use ponto como separador decimal (ex: 5000.00)</div>
                    </div>
                </div>
    
                <button type="submit" class="btn-submit">Cadastrar Funcionário</button>
            </form>
        </div>

        <div id="lista" data-method="get"></div>

    </main>
    <footer>

    </footer>
    <script src="/public/scripts/cadastrar.js"></script>
</body>
</html>
